meters:
- name: seats
  description: Number of licensed per-seat subscriptions on the account.
  unit: seats
  aggregation: sum
  dimensions:
  - account
  - plan
- name: files_transcribed
  description: Media files submitted for transcription; capped monthly on the Starter tier.
  unit: files
  aggregation: sum
  dimensions:
  - account
  - user
- name: minutes_transcribed
  description: Minutes of audio/video transcribed; a useful internal utilization meter even though Trint bills per seat, not per minute.
  unit: minutes
  aggregation: sum
  dimensions:
  - account
  - user
principles:
- name: Visibility
  description: Track seats, tier, and files/minutes transcribed per user so subscription cost maps to actual usage.
- name: Allocation
  description: Assign seats and shared drives per team so subscription spend maps to cost centers.
- name: Optimization
  description: Right-size seat counts and tiers; keep Starter users within the monthly file cap; move heavy API workloads to Enterprise where API access is intended.
- name: Accountability
  description: Assign an owner per workspace and review seat utilization against the annual commitment.
