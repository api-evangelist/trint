description: >-
  FinOps view of Trint spend. Trint is billed as a per-seat SaaS subscription
  (Starter, Advanced, Enterprise), typically on annual terms, rather than as
  metered pay-per-minute API usage. Cost is therefore driven primarily by the
  number of seats and the plan tier, plus the Starter monthly file cap. API
  access is bundled into the subscription (plan-dependent, with Enterprise
  recommended for heavy usage) rather than invoiced as a separate per-request
  line item.
notes: >-
  Per-seat list rates are approximate and reported by third-party reviews;
  verify on app.trint.com/plans. The dominant cost lever is seat count and tier
  selection, and - on Starter - staying within the monthly file cap. There is no
  documented per-minute or per-request API meter to reconcile.
