aid: trint
url: https://raw.githubusercontent.com/api-evangelist/trint/refs/heads/main/apis.yml
name: Trint
kind: company
description: >-
  Trint is an AI-powered audio and video transcription platform built for
  media, journalism, and enterprise content teams. It transcribes speech to
  text in dozens of languages, offers a collaborative editor, translation, and
  story-building tools, and exposes a documented REST API at dev.trint.com for
  uploading and transcribing media, listing and exporting transcripts (JSON,
  text, CSV, Word, SRT captions, EDL, Premiere XML), translating, running
  realtime transcription over an RTMP stream, and receiving webhook events.
